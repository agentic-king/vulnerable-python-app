name: Dependabot Alerts to Issues

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: read
  issues: write

jobs:
  dependabot:
    runs-on: ubuntu-latest

    steps:
      - name: Create issues for Dependabot alerts
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$REPO/dependabot/alerts?state=open" \
            --paginate \
            --jq '.[] |
              "Title: \(.security_advisory.summary)\nPackage: \(.dependency.package.name)\nSeverity: \(.security_advisory.severity)\nURL: \(.html_url)"'
